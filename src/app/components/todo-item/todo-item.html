<li class="task-item" [class.completed]="task.completed">
  
  <div class="task-content">
    <input type="checkbox" class="task-checkbox" [checked]="task.completed" (change)="cambiaStato.emit(task.id)">
    
    <div class="task-text-group">
      <span class="task-title">
        {{ task.title }}
      </span>
      <small class="task-date">
        Creata il: {{ task.createdAt | date:'dd/MM/yyyy HH:mm' }}
      </small>
    </div>
  </div>

  <button class="btn-delete" (click)="eliminaTask.emit(task.id)">
    Elimina
  </button>

</li>
