<main class="app-container">
  <h1 class="app-title">La mia To-Do List</h1>
  
  <div class="input-section">
    <input #nuovoTask type="text" class="task-input" placeholder="Scrivi un task...">
    <button class="btn btn-primary" (click)="aggiungi(nuovoTask.value); nuovoTask.value = ''">
      Aggiungi
    </button>
  </div>

  <ul class="task-list">
    @for (task of listaTask; track task.id) {
      <app-todo-item 
        [task]="task"
        (cambiaStato)="toggle($event)"
        (eliminaTask)="elimina($event)">
      </app-todo-item>
    }
  </ul>
</main>
